<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kindle サイネージ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <!-- 1. ヘッダー: 時計 + 主要路線ステータス -->
    <table class="header-tbl" cellspacing="0" cellpadding="0">
      <tr>
        <td class="hdr-left">
          <span class="clock-time" id="clock-time">--:--</span>
          <span class="clock-date" id="clock-date">--/--(-)</span>
        </td>
        <td class="hdr-right">
          <span id="primary-status-list">
            <span class="pill">運行情報...</span>
          </span>
          <button class="reload-btn" id="reload-btn" type="button">更新</button>
        </td>
      </tr>
    </table>

    <!-- 2. 今の降水状況バナー -->
    <div class="rain-banner" id="rain-banner">
      <span class="rain-state" id="rain-state">読み込み中...</span>
      <span class="rain-meta" id="rain-meta">--℃ / --mm</span>
    </div>

    <!-- 3. 東京アメッシュ（左） + これからの予報（右） -->
    <table class="weather-tbl" cellspacing="0" cellpadding="0">
      <tr>
        <td class="amesh-cell">
          <div class="amesh-stage">
            <img class="amesh-img" id="amesh-map"  src="/api/amesh/map"  alt="">
            <img class="amesh-img" id="amesh-mesh" src="" alt="" style="display:none;">
            <img class="amesh-img" id="amesh-mask" src="/api/amesh/mask" alt="">
            <div class="amesh-pin" id="amesh-pin"></div>
            <div class="amesh-err" id="amesh-err" style="display:none;">レーダー取得エラー</div>
          </div>
          <div class="amesh-caption">
            <span id="amesh-time">東京アメッシュ 読込中...</span>
            <span class="amesh-loc" id="amesh-pin-label">● 東京</span>
          </div>
        </td>
        <td class="forecast-cell">
          <div class="forecast-title">これからの予報</div>
          <div id="forecast-row">
            <div class="fc-empty">読込中...</div>
          </div>
        </td>
      </tr>
    </table>

    <!-- 4. 次の発車案内 -->
    <div id="departures-wrap">
      <div class="dep-card">
        <div class="dep-placeholder">発車時刻を取得中...</div>
      </div>
    </div>

    <!-- 5. その他地下鉄 運行状況 / 遅延詳細 -->
    <div class="other-trains" id="other-trains">
      <span class="other-label">運行詳細:</span>
      <span class="other-body" id="other-trains-body">読み込み中...</span>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
